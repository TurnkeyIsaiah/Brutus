<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<title>Lil Brutus</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000000;
    overflow: hidden;
    cursor: grab;
    user-select: none;
  }
  body.is-dragging { cursor: grabbing; }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    opacity: 1;
    mix-blend-mode: normal;
    /* Idle bob is this transform. It must not move the window. */
    transform: translateY(0);
  }
</style>
</head>
<body>
<canvas id="mascot" aria-hidden="true"></canvas>
<script src="../node_modules/animejs/dist/bundles/anime.umd.min.js"></script>
<script src="lil-brutus-motion.js"></script>
<script src="lil-brutus-page.js"></script>
</body>
</html>
