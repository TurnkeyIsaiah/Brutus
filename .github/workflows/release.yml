name: Release Desktop

# Build installers for every OS and publish them to a GitHub Release whenever a
# version tag is pushed (e.g. v1.3.2). electron-updater consumes the release
# artifacts and the generated latest*.yml feeds.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# electron-builder needs write access to create the GitHub Release and upload assets.
permissions:
  contents: write

jobs:
  # Nothing is built or published unless the unit tests and the Windows smoke
  # test (the real app launched with Playwright) pass on this exact commit.
  test:
    name: Tests (unit + Windows smoke)
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # Electron 42+ downloads its binary on first use; the smoke test triggers it.
      - name: Smoke test (launch the app)
        run: npm run test:smoke

  release:
    needs: test
    name: Build & publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: "--win"
          - os: macos-latest
            platform: "--mac"
          - os: ubuntu-latest
            platform: "--linux"
    # Tag pushes build every OS. A manual run uses the mac job below.
    if: github.event_name == 'push'

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Windows/Linux: no signing certs configured. The Apple signing env vars are
      # deliberately omitted here — setting CSC_LINK to an empty string makes
      # electron-builder treat it as a (broken) Windows signing cert path.
      - name: Build and publish
        if: runner.os != 'macOS'
        run: npx --no-install electron-builder ${{ matrix.platform }} --config electron-builder.config.js --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # macOS: code-signed (Developer ID) + notarized.
      # electron-builder 24 passes the .p12 password to set-key-partition-list.
      # macOS 26 rejects that even when the certificate password is right
      # (electron-builder#10066). Import the cert into our own keychain, then
      # hide CSC_LINK so electron-builder uses that identity.
      - name: Build and publish (macOS, signed + notarized)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # Print Apple's real notarization error. electron-builder hides it.
          xcrun notarytool history --apple-id "${APPLE_ID}" --password "${APPLE_APP_SPECIFIC_PASSWORD}" --team-id "${APPLE_TEAM_ID}"
          cert_path="${RUNNER_TEMP}/certificate.p12"
          keychain_path="${RUNNER_TEMP}/build.keychain"
          keychain_password="$(uuidgen)"
          printf '%s' "${CSC_LINK}" | tr -d '[:space:]' | base64 -D > "${cert_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 3600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${cert_path}" -k "${keychain_path}" -P "${CSC_KEY_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}" $(security list-keychains -d user | tr -d '"')
          identity_count="$(security find-identity -v -p codesigning "${keychain_path}" | grep -c 'Developer ID Application' || true)"
          if [ "${identity_count}" -lt 1 ]; then
            echo "No Developer ID Application identity in the signing keychain." >&2
            security find-identity -v -p codesigning "${keychain_path}" >&2 || true
            exit 1
          fi
          unset CSC_LINK CSC_KEY_PASSWORD
          npx --no-install electron-builder ${{ matrix.platform }} --config electron-builder.config.js --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  rebuild-mac:
    name: Rebuild macOS installers
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      # A manual rebuild republishes Mac installers under package.json's version.
      # It must run on exactly that version's tag, or Mac would ship different
      # code than Windows under the same version number.
      - name: Require the release tag
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"
          git fetch --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
          if [ "$(git rev-parse HEAD)" != "$(git rev-list -n1 "$tag")" ]; then
            echo "::error::Run this workflow from tag $tag (Actions > Run workflow > Use workflow from: $tag)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build and publish (macOS, signed + notarized)
        run: |
          set -euo pipefail
          # Print Apple's real notarization error. electron-builder hides it.
          xcrun notarytool history --apple-id "${APPLE_ID}" --password "${APPLE_APP_SPECIFIC_PASSWORD}" --team-id "${APPLE_TEAM_ID}"
          cert_path="${RUNNER_TEMP}/certificate.p12"
          keychain_path="${RUNNER_TEMP}/build.keychain"
          keychain_password="$(uuidgen)"
          printf '%s' "${CSC_LINK}" | tr -d '[:space:]' | base64 -D > "${cert_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 3600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${cert_path}" -k "${keychain_path}" -P "${CSC_KEY_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}" $(security list-keychains -d user | tr -d '"')
          identity_count="$(security find-identity -v -p codesigning "${keychain_path}" | grep -c 'Developer ID Application' || true)"
          if [ "${identity_count}" -lt 1 ]; then
            echo "No Developer ID Application identity in the signing keychain." >&2
            security find-identity -v -p codesigning "${keychain_path}" >&2 || true
            exit 1
          fi
          unset CSC_LINK CSC_KEY_PASSWORD
          npx --no-install electron-builder --mac --config electron-builder.config.js --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
