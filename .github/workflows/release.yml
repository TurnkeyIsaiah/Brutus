name: Release Desktop

# Build installers for every OS and publish them to a GitHub Release whenever a
# version tag is pushed (e.g. v1.3.2). electron-updater consumes the release
# artifacts and the generated latest*.yml feeds.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# electron-builder needs write access to create the GitHub Release and upload assets.
permissions:
  contents: write

jobs:
  release:
    name: Build & publish (${{ matrix.os }})
    # A manual run only rebuilds macOS. Tag pushes still build every OS.
    if: github.event_name != 'workflow_dispatch' || matrix.os == 'macos-latest'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: "--win"
          - os: macos-latest
            platform: "--mac"
          - os: ubuntu-latest
            platform: "--linux"

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Windows/Linux: no signing certs configured. The Apple signing env vars are
      # deliberately omitted here — setting CSC_LINK to an empty string makes
      # electron-builder treat it as a (broken) Windows signing cert path.
      - name: Build and publish
        if: runner.os != 'macOS'
        run: npx --no-install electron-builder ${{ matrix.platform }} --config electron-builder.config.js --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # macOS: code-signed (Developer ID) + notarized.
      # electron-builder 24 passes the .p12 password to set-key-partition-list.
      # macOS 26 rejects that even when the certificate password is right
      # (electron-builder#10066). Import the cert into our own keychain, then
      # hide CSC_LINK so electron-builder uses that identity.
      - name: Build and publish (macOS, signed + notarized)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          cert_path="${RUNNER_TEMP}/certificate.p12"
          keychain_path="${RUNNER_TEMP}/build.keychain"
          keychain_password="$(uuidgen)"
          printf '%s' "${CSC_LINK}" | tr -d '[:space:]' | base64 -D > "${cert_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 3600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${cert_path}" -k "${keychain_path}" -P "${CSC_KEY_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}" $(security list-keychains -d user | tr -d '"')
          identity_count="$(security find-identity -v -p codesigning "${keychain_path}" | grep -c 'Developer ID Application' || true)"
          if [ "${identity_count}" -lt 1 ]; then
            echo "No Developer ID Application identity in the signing keychain." >&2
            security find-identity -v -p codesigning "${keychain_path}" >&2 || true
            exit 1
          fi
          unset CSC_LINK CSC_KEY_PASSWORD
          npx --no-install electron-builder ${{ matrix.platform }} --config electron-builder.config.js --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
